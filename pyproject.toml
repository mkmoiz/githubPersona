[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpersona"
version = "1.1.0"
description = "A lightweight local dashboard for managing multiple Git identities, SSH keys, and commit signing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Moiz Khan", email = "mkmoiz047@gmail.com" }
]
keywords = ["git", "github", "ssh", "identity", "commit-signing", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
gitpersona = "app:main"

[tool.setuptools.package-data]
gitpersona = ["static/*"]
